<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  /* Gruvbox soft */
  :root {
    --bg: #F2E5BC; --fg: #504945; --muted: #7C6F64; --line: #D5C4A1; --accent: #AF3A03; --panel: #EBDBB2;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #32302F; --fg: #D5C4A1; --muted: #928374; --line: #504945; --accent: #FE8019; --panel: #3C3836; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--bg); color: var(--fg); font: 1.15rem/1.5 var(--mono);
  }
  main { width: min(40rem, 88vw); margin-top: -8vh; }
  #clock { font-size: clamp(4rem, 12vw, 8.5rem); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  #date { color: var(--muted); margin-top: .5rem; }
  form { position: relative; display: flex; gap: 1ch; margin-top: 1.6rem; }
  form label { color: var(--accent); user-select: none; }
  #q {
    flex: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: none;
    font: inherit; color: var(--fg); caret-color: transparent;
  }
  /* Block cursor drawn over the input; the native caret is hidden above. */
  .field { position: relative; flex: 1; min-width: 0; display: flex; }
  #caret { position: absolute; top: 0; width: 1ch; background: var(--accent); color: var(--bg); white-space: pre; pointer-events: none; }
  .field:not(:focus-within) #caret { display: none; }
  #chip { background: var(--line); color: var(--accent); font-weight: 600; padding: 0 1ch; }
  #chip[hidden] { display: none; }
  /* One list: matching engine keys first, then suggestions. */
  #sugg {
    position: absolute; top: calc(100% + .4rem); left: calc(3ch - 3px); right: 0; z-index: 1; /* row text lines up with the typed text */
    margin: 0; padding: .3rem 0; list-style: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--muted);
  }
  #sugg li { padding: 0 1ch; border-left: 2px solid transparent; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sugg li.key { display: grid; grid-template-columns: 4ch auto; gap: 2ch; }
  #sugg b { color: var(--accent); }
  #sugg .rest, #sugg .hit { color: var(--fg); }
  #sugg .hit, #sugg [aria-selected="true"] { background: var(--line); }
  #sugg [aria-selected="true"] { border-left-color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    #sugg { animation: in .12s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(-.2rem); } }
  }
</style>
</head>
<body>
<main>
  <div id="clock"></div>
  <div id="date"></div>
  <form id="search" autocomplete="off">
    <label for="q">~ ❯</label>
    <span id="chip" hidden></span>
    <span class="field">
      <input id="q" type="text" spellcheck="false" autofocus
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg">
      <span id="caret" aria-hidden="true"></span>
    </span>
    <ul id="sugg" role="listbox" aria-label="Suggestions" hidden></ul>
  </form>
</main>
<script>
  const SEARCH_URL = 'https://www.google.com/search?q=';
  const SUGGEST_URL = 'https://suggest.selimd.me/?q=';
  const HOUR_12 = false;
  // First word picks the engine. A bare key opens the site; entries without search are links only, so "life foo" is a normal search.
  const ENGINES = {
    gh: { name: 'github',    search: 'https://github.com/search?q=',              home: 'https://github.com' },
    yt: { name: 'youtube',   search: 'https://www.youtube.com/results?search_query=', home: 'https://www.youtube.com' },
    w:  { name: 'wikipedia', search: 'https://en.wikipedia.org/w/index.php?search=', home: 'https://en.wikipedia.org' },
    life: { name: 'life.selimd.me', home: 'https://life.selimd.me' },
  };

  const clock = document.getElementById('clock');
  const date = document.getElementById('date');
  function tick() {
    const d = new Date();
    clock.textContent = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: HOUR_12 }).replace(/\s*[AP]M$/i, '');
    date.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  function isAddress(s) {
    return /^(https?|file):\/\//i.test(s)
      || /^localhost(:\d+)?(\/\S*)?$/i.test(s)
      || /^[^\s/]+\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(s);
  }

  function resolve(raw) {
    const s = raw.trim();
    if (!s) return null;
    const [head, ...rest] = s.split(/\s+/);
    const engine = Object.hasOwn(ENGINES, head) && ENGINES[head];
    if (engine && !rest.length) return engine.home;
    if (engine?.search) return engine.search + encodeURIComponent(rest.join(' '));
    if (/^(https?|file):\/\//i.test(s)) return s;
    if (isAddress(s)) return (/^localhost/i.test(s) ? 'http://' : 'https://') + s;
    return SEARCH_URL + encodeURIComponent(s);
  }

  const q = document.getElementById('q');
  const sugg = document.getElementById('sugg');
  const chip = document.getElementById('chip');
  let active = null; // engine key shown as a chip once "key<space>" is typed

  function setActive(key) {
    active = key;
    chip.textContent = key || '';
    chip.hidden = !key;
  }

  // ponytail: 1ch-per-character positioning, so wide glyphs (CJK, emoji) misplace the block; measure text width if that matters.
  const caret = document.getElementById('caret');
  function drawCaret() {
    const i = q.selectionStart;
    caret.hidden = i !== q.selectionEnd;
    caret.textContent = q.value[i] || ' ';
    caret.style.left = `calc(${i}ch - ${q.scrollLeft}px)`;
  }
  ['focus', 'selectionchange', 'scroll'].forEach(t => q.addEventListener(t, drawCaret));

  // Dropdown rows: { key } for an engine the first word could become, { text } for a fetched suggestion.
  let items = [];
  let hi = -1;    // highlighted row, -1 = the typed text
  let typed = ''; // input text before arrow keys previewed a row
  let timer, ctrl;

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function render() {
    const t = typed.trim().toLowerCase();
    sugg.hidden = !items.length;
    sugg.innerHTML = items.map((it, i) => {
      const attrs = `id="opt-${i}" role="option" aria-selected="${i === hi}"`;
      if (it.key) return `<li class="key${it.key === t ? ' hit' : ''}" ${attrs}><b>${it.key}</b><span>${ENGINES[it.key].name}</span></li>`;
      const n = it.text.toLowerCase().startsWith(t) ? t.length : 0;
      return `<li ${attrs}>${esc(it.text.slice(0, n))}<span class="rest">${esc(it.text.slice(n))}</span></li>`;
    }).join('');
    q.setAttribute('aria-expanded', items.length > 0);
    if (hi >= 0) q.setAttribute('aria-activedescendant', 'opt-' + hi);
    else q.removeAttribute('aria-activedescendant');
  }

  function close() {
    clearTimeout(timer);
    ctrl?.abort();
    items = [];
    hi = -1;
    render();
  }

  // Key rows show at once; suggestions are appended after a debounce. Failures leave just the key rows.
  function update(keys) {
    clearTimeout(timer);
    ctrl?.abort();
    const keyItems = keys.map(key => ({ key }));
    items = keyItems;
    hi = -1;
    render();
    const text = typed.trim();
    if (!text || active) return;
    timer = setTimeout(async () => {
      ctrl = new AbortController();
      try {
        const res = await fetch(SUGGEST_URL + encodeURIComponent(text), { signal: ctrl.signal });
        const data = res.ok ? await res.json() : [];
        const list = Array.isArray(data) ? data.filter(s => typeof s === 'string' && s.trim().toLowerCase() !== text.toLowerCase()) : [];
        items = [...keyItems, ...list.map(text => ({ text }))].slice(0, 8);
        render();
      } catch {
        // Aborted or Worker down: keep whatever is showing.
      }
    }, 150);
  }

  q.addEventListener('input', () => {
    const m = !active && q.value.match(/^\s*(\S+)\s/);
    if (m && Object.hasOwn(ENGINES, m[1]) && ENGINES[m[1]].search) {
      setActive(m[1]);
      q.value = q.value.slice(m[0].length).trimStart();
    }
    typed = q.value;
    const v = typed.trimStart();
    update(!active && v && !/\s/.test(v) ? Object.keys(ENGINES).filter(k => k.startsWith(v)) : []);
    drawCaret();
  });

  function move(d) {
    hi = Math.max(-1, Math.min(items.length - 1, hi + d));
    q.value = hi < 0 ? typed : items[hi].key || items[hi].text;
    q.setSelectionRange(q.value.length, q.value.length);
    render();
    drawCaret();
  }

  // Engines with search become the chip; link-only ones (no search) open right away.
  function pickKey(key) {
    if (!ENGINES[key].search) {
      q.value = key;
      return go();
    }
    setActive(key);
    q.value = typed = '';
    close();
    drawCaret();
  }

  function go() {
    const url = resolve(active ? `${active} ${q.value}` : q.value);
    close();
    if (url) location.href = url;
  }

  q.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && active && q.selectionStart === 0 && q.selectionEnd === 0) {
      // Backspace at the start of the field removes the chip.
      e.preventDefault();
      setActive(null);
      q.dispatchEvent(new Event('input'));
    } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && items.length) {
      e.preventDefault();
      move(e.key === 'ArrowDown' ? 1 : -1);
    } else if (e.key === 'Escape') {
      // First Esc closes the dropdown, the next one leaves the field.
      if (items.length) {
        e.preventDefault();
        e.stopPropagation();
        q.value = typed;
        close();
        drawCaret();
      } else {
        q.blur();
      }
    } else if (e.key === 'Enter' && items[hi]?.key) {
      e.preventDefault();
      pickKey(items[hi].key);
    }
  });
  q.addEventListener('blur', close);

  // mousedown + preventDefault keeps focus in the input so blur doesn't close the list before the pick lands.
  sugg.addEventListener('mousedown', e => {
    const li = e.target.closest('[role=option]');
    if (!li) return;
    e.preventDefault();
    const it = items[+li.id.slice(4)];
    if (it.key) return pickKey(it.key);
    q.value = it.text;
    go();
  });

  document.getElementById('search').addEventListener('submit', e => {
    e.preventDefault();
    go();
  });
</script>
</body>
</html>
